<svg class="diagram" viewBox="0 0 400 436" role="img" aria-label="The hologenome: the host genome shapes the gut microbiome; together they influence performance and resilience, which inform selection" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah-microbiome" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="dg-ah" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="dg-holo" x="34" y="30" width="332" height="148" rx="74"/><text class="dg-c" x="200.0" y="20.0">the hologenome</text><line class="dg-arc" x1="172" y1="104" x2="226" y2="104" marker-end="url(#ah-microbiome)"/><text class="dg-s dg-i" x="200.0" y="94.0">shapes</text><line class="dg-arc" x1="110.0" y1="166.0" x2="110.0" y2="188.0" marker-end="url(#ah-microbiome)"/><line class="dg-arc" x1="290.0" y1="166.0" x2="290.0" y2="188.0" marker-end="url(#ah-microbiome)"/><line class="dg-arc" x1="157.9" y1="143.4" x2="240.6" y2="211.4" marker-end="url(#ah-microbiome)"/><line class="dg-arc" x1="242.1" y1="143.4" x2="159.4" y2="211.4" marker-end="url(#ah-microbiome)"/><line class="dg-arc" x1="147.2" y1="301.6" x2="161.6" y2="320.8" marker-end="url(#ah-microbiome)"/><line class="dg-arc" x1="252.8" y1="301.6" x2="238.4" y2="320.8" marker-end="url(#ah-microbiome)"/><circle class="dg-node" cx="110" cy="104" r="58"/><text class="dg-t" x="110.0" y="98.0">Host genome</text><text class="dg-s" x="110.0" y="117.0">the animal's</text><text class="dg-s" x="110.0" y="131.0">own genes</text><circle class="dg-node" cx="290" cy="104" r="58"/><text class="dg-t" x="290.0" y="98.0">Microbiome</text><text class="dg-s" x="290.0" y="117.0">the microbes</text><text class="dg-s" x="290.0" y="131.0">in the gut</text><circle class="dg-node" cx="110" cy="252" r="58"/><text class="dg-t" x="110.0" y="246.0">Performance</text><text class="dg-s" x="110.0" y="265.0">growth, efficiency,</text><text class="dg-s" x="110.0" y="279.0">carcass traits</text><circle class="dg-node" cx="290" cy="252" r="58"/><text class="dg-t" x="290.0" y="246.0">Resilience</text><text class="dg-s" x="290.0" y="265.0">coping with</text><text class="dg-s" x="290.0" y="279.0">heat stress</text><circle class="dg-node dg-k" cx="200" cy="372" r="58"/><text class="dg-t dg-k" x="200.0" y="366.0">Selection</text><text class="dg-s dg-k" x="200.0" y="385.0">for animals that</text><text class="dg-s dg-k" x="200.0" y="399.0">cope better</text></svg>
