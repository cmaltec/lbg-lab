# site.yml
#
# Rebuilds the site weekly and on every push: refreshes publications from
# ORCID and OpenAlex, renders the pages, and deploys to GitHub Pages. The
# deploy job runs only once the repository is public (free GitHub plans do
# not serve Pages from private repositories); until then the build still runs
# and fails loudly if the fetch or the render breaks.
#
# Author: Christian Maltecca
# E-mail: cmaltec@ncsu.edu
# Date: 2026-10-08

name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"      # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh publications
        run: python scripts/01_fetch_publications.py
      - name: Render site
        run: python scripts/02_build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
